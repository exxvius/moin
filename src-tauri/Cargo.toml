# The app crate is also the workspace root. `moin-core` is the shell-free engine;
# `moin-daemon` is the process that actually hosts it. This crate is now just the
# Tauri UI, and talks to the daemon over loopback like any other client.
[workspace]
members = [".", "crates/moin-core", "crates/moin-daemon"]
resolver = "2"

# Shared across every crate so a version can never drift between them.
[workspace.package]
version = "0.4.0"
authors = ["moin contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[workspace.dependencies]
moin-core = { path = "crates/moin-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "process", "net", "signal"] }
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "charset", "json"] }
futures-util = "0.3"
async-trait = "0.1"
librqbit = { git = "https://github.com/exxvius/rqbit", rev = "b8f0c52642a3dd8f1956683491276b5a4620feea", default-features = false, features = ["default-tls"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"
regex = "1"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

[package]
name = "moin"
version.workspace = true
description = "A general downloader with a built-in BitTorrent client."
authors.workspace = true
license.workspace = true
edition.workspace = true
rust-version.workspace = true

# The library holds the whole app so the engine can be unit-tested without the
# Tauri shell. `main.rs` is a thin binary that calls into it.
[lib]
name = "moin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# The engine itself lives in the daemon process; the app only needs its types to
# talk about tasks and settings over the wire.
moin-core = { workspace = true }

tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# The browser extension launches moin via a `moin://` URL when it isn't running.
# deep-link registers the scheme; single-instance (with its deep-link feature)
# funnels a second launch back to the running window instead of double-binding the
# RPC port.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender = { workspace = true }

# Tauri hosts a tokio runtime the app uses for its own async work (spawning and
# health-checking the daemon).
tokio = { workspace = true }

# Talking to the daemon over loopback.
reqwest = { workspace = true }

[features]
# Enable custom protocol in production; keep default off for dev.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"     # desktop app, optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true
