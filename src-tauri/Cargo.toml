[package]
name = "moin"
version = "0.1.0"
description = "A general downloader with a built-in BitTorrent client."
authors = ["moin contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# The library holds the whole app so the engine can be unit-tested without the
# Tauri shell. `main.rs` is a thin binary that calls into it.
[lib]
name = "moin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
# The end-to-end RPC test drives the loopback server like the extension will.
# Blocking reqwest keeps the test synchronous (no runtime to stand up itself).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
# The browser extension launches moin via a `moin://` URL when it isn't running.
# deep-link registers the scheme; single-instance (with its deep-link feature)
# funnels a second launch back to the running window instead of double-binding the
# RPC port.
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Async runtime for the download engines (librqbit + media land in later phases;
# Tauri already hosts a tokio runtime we build on). `process` drives the managed
# aria2c daemon and its `--version` probe.
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time", "process", "net"] }

# Direct HTTP downloads: streaming bodies + Range-based resume. rustls keeps the
# TLS stack self-contained (no system OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "charset", "json"] }
futures-util = "0.3"
# Async methods on the pluggable DownloadBackend trait (dyn-dispatched).
async-trait = "0.1"

# Embedded BitTorrent engine: an in-process librqbit Session drives magnets and
# .torrent files with no external tools. We pin a small moin fork of rqbit
# (branch `moin`) that exposes the have-bitfield + per-peer piece availability
# upstream keeps internal, so we can draw a piece bar + availability figure.
# default-features off drops the bundled http-api/webui/axum surface we don't use;
# default-tls keeps the TLS stack on native TLS (no NASM/aws-lc).
librqbit = { git = "https://github.com/exxvius/rqbit", rev = "434c37094f18baf3f3d0fe29fe5e7d267894582e", default-features = false, features = ["default-tls"] }

# Download registry + resume state.
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

# Managed-tool fetch: unzip the aria2c release archive and checksum it before we
# trust the binary.
zip = { version = "2", default-features = false, features = ["deflate"] }
sha2 = "0.10"

# Loopback RPC server the browser extension posts captured downloads to. Small,
# pure-Rust, blocking HTTP/1.1 — it runs on its own thread and calls into the
# (thread-safe) engine, so it stays off Tauri's async runtime.
tiny_http = "0.12"

[features]
# Enable custom protocol in production; keep default off for dev.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"     # desktop app, optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true
