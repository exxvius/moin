[package]
name = "moin"
version = "0.1.0"
description = "A general downloader with a built-in BitTorrent client."
authors = ["moin contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

# The library holds the whole app so the engine can be unit-tested without the
# Tauri shell. `main.rs` is a thin binary that calls into it.
[lib]
name = "moin_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

# Async runtime for the download engines (librqbit + media land in later phases;
# Tauri already hosts a tokio runtime we build on).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs", "io-util", "time"] }

# Direct HTTP downloads: streaming bodies + Range-based resume. rustls keeps the
# TLS stack self-contained (no system OpenSSL).
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls", "http2", "charset"] }
futures-util = "0.3"
# Async methods on the pluggable DownloadBackend trait (dyn-dispatched).
async-trait = "0.1"

# Download registry + resume state.
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }

[features]
# Enable custom protocol in production; keep default off for dev.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"     # desktop app, optimize for size
lto = true
codegen-units = 1
panic = "abort"
strip = true
